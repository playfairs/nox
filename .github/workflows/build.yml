name: Build

on:
  push:
    branches:
      - dev
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run Nix check
        run: nix flake check

  linux-build:
    name: Linux x86_64
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Build release package
        run: |
          cargo b -r --timings

          mkdir -p dist
          cp target/release/nox dist/nox-x86_64-linux
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: nox-${{ github.sha }}-x86_64-linux
          path: target/release/nox
          if-no-files-found: error

  macos-build:
    name: macOS aarch64
    needs: tests
    runs-on: macos-latest
    steps:
      - name: Checkoute
        uses: actions/checkout@v4
      - name: Use nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Build release package
        run: |
          cargo b -r --timings

          mkdir -p dist
          cp target/release/nox dist/nox-aarch64-macos
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: nox-${{ github.sha }}-aarch64-macos
          path: dist/nox-aarch64-macos
          if-no-files-found: error
