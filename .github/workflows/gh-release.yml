name: Create Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: nox-${{ github.sha }}-*
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          name: Nox ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/**/nox-${{ github.sha }}-*
