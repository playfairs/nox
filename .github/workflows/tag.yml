name: Build dev tag

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run Nix checks
        run: nix flake check

  linux-build:
    name: Linux x86_64
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          nix develop --command bash -lc 'nox setup build-ci --release && nox compile -C build-ci -j2'
          output="build-ci/release/nox/nox"
          test -x "$output"
          test "$("$output" --version)" = "nox $version"
          mkdir -p dist
          cp "$output" "dist/nox-v${version}-linux-x86_64"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/nox-v*-linux-x86_64
          if-no-files-found: error

  macos-build:
    name: macOS arm64
    needs: checks
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          nix develop --command bash -lc 'nox setup build-ci --release && nox compile -C build-ci -j2'
          output="build-ci/release/nox/nox"
          test -x "$output"
          test "$("$output" --version)" = "nox $version"
          mkdir -p dist
          cp "$output" "dist/nox-v${version}-macos-arm64"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/nox-v*-macos-arm64
          if-no-files-found: error

  dev-tag:
    name: Publish dev build
    needs:
      - linux-build
      - macos-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nox-dev-tags
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux-x86_64
      - name: Download macOS executable
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64
      - name: Verify dev executables
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          linux_asset="dist/linux-x86_64/nox-v${version}-linux-x86_64"
          macos_asset="dist/macos-arm64/nox-v${version}-macos-arm64"
          test -f "$linux_asset"
          test -f "$macos_asset"
          chmod +x "$linux_asset" "$macos_asset"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create numbered dev tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          last_number="$(git tag --list 'nox-dev.*' | sed -nE 's/^nox-dev\.([0-9]+)$/\1/p' | sort -n | tail -n 1)"
          next_number=0
          if [[ -n "$last_number" ]]; then next_number=$((last_number + 1)); fi
          tag="nox-dev.${next_number}"
          while git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; do
            next_number=$((next_number + 1))
            tag="nox-dev.${next_number}"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$GITHUB_SHA" -m "Dev build ${tag}"
          git push origin "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Publish dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          files: |
            dist/linux-x86_64/nox-v${{ steps.verify.outputs.version }}-linux-x86_64
            dist/macos-arm64/nox-v${{ steps.verify.outputs.version }}-macos-arm64