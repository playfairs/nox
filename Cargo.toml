[package]
name = "nox"
version = "1.3.6"
edition = "2024"
build = "build.rs"
description = "The Nox Build & Automation System"
license = "Unlicense"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde_json = "1"
askalono = "0.5"
license = "3.8"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.noml]
path = "./noml"
