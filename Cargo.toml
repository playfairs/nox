[workspace]
resolver = "3"
default-members = [
  "nox"
]
members = [
  "nox",
  "noml",
  "demos/rust"
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[workspace.dependencies]
serde_json = "1"
askalono = "0.5"
license = "3.8"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.noml]
path = "./noml"
