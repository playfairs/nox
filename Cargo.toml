[package]
name = "nox"
description = "The Nox Build & Automation System"
version = "1.3.6"
edition = "2024"
license = "Unlicense"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[dependencies]
serde_json = "1.0"
velopack = "1.2"
askalono = "0.5"
license = "3.8"
semver = "1.0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.noml]
path = "./noml"
